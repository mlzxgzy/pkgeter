# Flat preset list — each key is one system-version combination.
# No template substitution; URLs are fully resolved.
# Mirrors are a list with name + provider info.

debian-bookworm:
  system: debian
  backend: apt
  arch: amd64
  repos:
    - name: main
      type: deb
      url: https://deb.debian.org/debian
      release: bookworm
      components: [main]
    - name: security
      type: deb
      url: https://security.debian.org/debian-security
      release: bookworm-security
      components: [main]
    - name: updates
      type: deb
      url: https://deb.debian.org/debian
      release: bookworm-updates
      components: [main]
  mirrors:
    - name: cn
      provider: ustc
      urls:
        main: https://mirrors.ustc.edu.cn/debian
        security: https://mirrors.ustc.edu.cn/debian-security
        updates: https://mirrors.ustc.edu.cn/debian

