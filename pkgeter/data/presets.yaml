centos-9:
  system: centos
  backend: rpm
  arch: x86_64
  repos:
    - name: baseos
      type: rpm
      url: https://mirror.stream.centos.org/9-stream/BaseOS/x86_64/os
    - name: appstream
      type: rpm
      url: https://mirror.stream.centos.org/9-stream/AppStream/x86_64/os
    - name: epel
      type: rpm
      url: https://dl.fedoraproject.org/pub/epel/9/Everything/x86_64
  mirrors:
