debian-bookworm:
  backend: apt
  arch: amd64
  repos:
    - name: main
      type: deb
      url: https://deb.debian.org/debian
      release: bookworm
      components: [main]
    - name: security
      type: deb
      url: https://security.debian.org/debian-security
      release: bookworm-security
      components: [main]
    - name: updates
      type: deb
      url: https://deb.debian.org/debian
      release: bookworm-updates
      components: [main]
  mirrors:
    cn:
      repos:
        - name: main
          type: deb
          url: https://mirrors.ustc.edu.cn/debian
          release: bookworm
          components: [main]
        - name: security
          type: deb
          url: https://mirrors.ustc.edu.cn/debian-security
          release: bookworm-security
          components: [main]
        - name: updates
          type: deb
          url: https://mirrors.ustc.edu.cn/debian
          release: bookworm-updates
          components: [main]

