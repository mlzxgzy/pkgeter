[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgeter"
version = "1.0.0"
description = "Offline Debian package downloader - resolve deps, download .deb, generate offline install script"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["debian", "offline", "package", "apt", "downloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Packaging",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.25",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/mlzxgzy/pkgeter"
Repository = "https://github.com/mlzxgzy/pkgeter.git"
BugTracker = "https://github.com/mlzxgzy/pkgeter/issues"

[project.scripts]
pkgeter = "pkgeter.__main__:main"

[tool.setuptools.packages.find]
include = ["pkgeter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8"]
