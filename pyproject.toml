[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pkgeter"
version = "1.3.2"
description = "Offline package downloader - support Debian/apt and RPM/dnf, resolve deps, download packages, generate offline install script"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["debian", "rpm", "centos", "offline", "package", "apt", "dnf", "yum", "downloader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving :: Packaging",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.25",
    "pyyaml>=6.0",
    "pyreadline3; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/mlzxgzy/pkgeter"
Repository = "https://github.com/mlzxgzy/pkgeter.git"
BugTracker = "https://github.com/mlzxgzy/pkgeter/issues"

[project.scripts]
pkgeter = "pkgeter.__main__:main"

[tool.setuptools.packages.find]
include = ["pkgeter*"]

[tool.setuptools.package-data]
pkgeter = ["data/*.yaml", "data/*.html", "data/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8"]
